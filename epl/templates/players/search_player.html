{% for player in players %}
  <tr>
    <td>{{loop.index}}</td>
    <td>{{player.name}}</td>
    <td>{{player.clean_sheets if player.clean_sheets is not none else '-'}}</td>
    <td>
      <a href="{{url_for('players.info_player', id=player.id)}}" class="btn btn-outline-info btn-sm">
        <i class="bi bi-info-circle"></i>
      </a>
    </td>
  </tr>
{% endfor %}
